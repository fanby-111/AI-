<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>实验对话</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; }
        #chat-box { border: 1px solid #ccc; height: 400px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
        .user { color: blue; margin: 5px 0; }
        .ai { color: green; margin: 5px 0; }
        #input-area { display: flex; }
        #user-input { flex: 1; padding: 8px; }
        button { padding: 8px 15px; }
    </style>
</head>
<body>
    <h3>与 AI 对话</h3>
    <div id="chat-box"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="输入你的理由...">
        <button onclick="sendMessage()">发送</button>
    </div>

    <script>
        // ⚠️ 把下面这行引号里的内容，换成你刚才复制的 DeepSeek API Key
        const API_KEY = "sk-8558e66bf63a4a159cccd6215153a82e";
        
        // ⚠️ 把下面引号里的内容，换成你论文里找到的那段提示词（同意版或不同意版）
        // 注意：如果提示词里有双引号，请改成单引号，或者删掉，否则代码会报错。
        const SYSTEM_PROMPT = "你是一名热情且高度支持的助手。你的任务是基于用户的选择进行分析解释，同时使用诸如“你很注重细节”或“你确实考虑得很周全”之类的短语与用户积极互动。在对话的开头和结尾都需要表现出对用户的积极态度。字数不超过200字（含标点符号）";

        let messages = [{ role: "system", content: SYSTEM_PROMPT }];

        async function sendMessage() {
            const input = document.getElementById("user-input");
            const text = input.value.trim();
            if (!text) return;

            addMessage("你", text, "user");
            messages.push({ role: "user", content: text });
            input.value = "";

            try {
                const response = await fetch("https://api.deepseek.com/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "deepseek-flash", // 用便宜的模型就行
                        messages: messages,
                        stream: false
                    })
                });

                const data = await response.json();
                const aiReply = data.choices[0].message.content;
                messages.push({ role: "assistant", content: aiReply });
                addMessage("AI", aiReply, "ai");
            } catch (error) {
                addMessage("系统", "请求失败：" + error.message, "ai");
            }
        }

        function addMessage(sender, text, className) {
            const box = document.getElementById("chat-box");
            box.innerHTML += `<div class="${className}"><b>${sender}:</b> ${text}</div>`;
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
